name: Monthly YouTube stats refresh

# Updates the YouTube view/subscriber figures on seller pages.
# Runs on the 1st of each month at 12:17 UTC (~7 AM US Central), whenever a seller page
# (selling*.html) is added or changed, and by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 12 1 * *"
  push:
    branches: [main]
    paths: ["selling*.html"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh YouTube figures
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/yt-stats.mjs

      - name: Commit if anything changed
        run: |
          if [[ -n "$(git status --porcelain -- '*.html')" ]]; then
            git config user.name "stats-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html'
            git commit -m "Monthly YouTube stats refresh"
            git pull --rebase
            git push
            echo "Stats updated and pushed. Netlify will redeploy automatically."
          else
            echo "No changes."
          fi
